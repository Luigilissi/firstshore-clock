name: Firstshore clock
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firstshore-clock
  cancel-in-progress: false
jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Advance the shared world
        env:
          WORLD_HEARTBEAT_SECRET: ${{ secrets.WORLD_HEARTBEAT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORLD_HEARTBEAT_SECRET"
          for attempt in 1 2 3 4; do
            curl --silent --show-error --fail-with-body --max-time 55 --request POST \
              --header "Authorization: Bearer $WORLD_HEARTBEAT_SECRET" \
              --output "$RUNNER_TEMP/firstshore-tick.json" \
              'https://firstshore-living-island.lissiluigi.chatgpt.site/api/heartbeat'
            cat "$RUNNER_TEMP/firstshore-tick.json"
            if jq -e '.catchingUp == false' "$RUNNER_TEMP/firstshore-tick.json" > /dev/null; then exit 0; fi
          done
          echo 'World still behind; the next scheduled run will continue.' >&2
          exit 1
      - name: Record weekly world status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const endpoint = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY + '/contents/world-status.json';
            const headers = {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'};
            const old = await fetch(endpoint, {headers});
            if (!old.ok && old.status !== 404) throw Error('Status record read failed: ' + old.status);
            const file = old.ok ? await old.json() : null;
            const period = Math.floor(Date.now() / (7 * 86400000));
            if (file && JSON.parse(Buffer.from(file.content, 'base64').toString()).period === period) return;
            const heartbeat = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/firstshore-tick.json', 'utf8'));
            const content = Buffer.from(JSON.stringify({period, recordedAt: new Date().toISOString(), ...heartbeat}, null, 2) + '\n').toString('base64');
            const saved = await fetch(endpoint, {method:'PUT', headers:{...headers,'Content-Type':'application/json'}, body:JSON.stringify({message:'Registra lo stato settimanale del mondo', content, ...(file ? {sha:file.sha} : {})})});
            if (!saved.ok) throw Error('Status record write failed: ' + saved.status);
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
