name: Firstshore clock
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: firstshore-clock
  cancel-in-progress: false
jobs:
  advance:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Advance the shared world
        env:
          WORLD_HEARTBEAT_SECRET: ${{ secrets.WORLD_HEARTBEAT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WORLD_HEARTBEAT_SECRET"
          for attempt in 1 2 3 4; do
            curl --silent --show-error --fail-with-body --max-time 55 --request POST \
              --header "Authorization: Bearer $WORLD_HEARTBEAT_SECRET" \
              --output "$RUNNER_TEMP/firstshore-tick.json" \
              'https://firstshore-living-island.lissiluigi.chatgpt.site/api/heartbeat'
            cat "$RUNNER_TEMP/firstshore-tick.json"
            if jq -e '.catchingUp == false' "$RUNNER_TEMP/firstshore-tick.json" > /dev/null; then exit 0; fi
          done
          echo 'World still behind; the next scheduled run will continue.' >&2
          exit 1
